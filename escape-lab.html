<div class="layout"><section class="card readouts"><h2>실시간 관측</h2><div class="metrics"><div><small>고도 · km</small><strong id="alt"></strong></div><div><small>수직 속도 · km/s</small><strong id="vel"></strong></div><div><small>현지 탈출속도 · km/s</small><strong id="esc"></strong></div></div>

'use strict';
const $=id=>document.getElementById(id), G=6.67430e-11, M=5.9722e24,R0=6371000;
const format=(x,n=2)=>x.toLocaleString('ko-KR',{maximumFractionDigits:n,minimumFractionDigits:n});
function fields(target,specs){for(const [id,name,value,min,max,step] of specs){const l=document.createElement('label');l.className='line';l.textContent=name;const e=document.createElement('input');Object.assign(e,{id,type:'number',value,defaultValue:String(value),min,max,step:step||'any',required:true});l.append(e);$(target).append(l)}}
fields('shipFields',[['kg','질량 (kg)',10000,100,10000],['area','단면적 (m²)',10,10,100],['thrust','추력 (MN)',30,30,1000]]);
fields('launchFields',[['height','발사 고도 (km)',0,0,10000],['speed','초기 속력 (km/s)',0,0,200],['burn','추력 작용 시간 (초)',5,1,10,1]]);
fields('conditions',[['detach','연료통 분리 시점 (초)',0,0,14400,1],['duration','실험 시간 (초)',600,1,14400,1]]);
const note=document.createElement('small');note.textContent='0초는 분리하지 않는 조건입니다. 지정한 시점에 초기 질량의 20%를 한 번 분리합니다.';$('conditions').append(note);
fields('airFields',[['decay','고도 1 km당 감소율 (%)',11.1,0,100]]);
function syncAir(){$('decay').disabled=!$('air').checked}
$('air').onchange=syncAir;syncAir();
function massRatio(){const v=$('planet').valueAsNumber;return $('mode').value==='mass'?v:v**3}
function linkPlanet(){const m=massRatio(),e=$('planet');const ok=m>=.1-1e-12&&m<=10+1e-12;e.setCustomValidity(ok?'':'밀도를 유지하는 질량 범위는 지구의 0.1~10배입니다.');$('linked').textContent=ok?'밀도 고정 · 질량 '+format(m,3)+'배 / 반지름 '+format(Math.cbrt(m),3)+'배':'허용 범위 · 질량 0.1~10배 / 반지름 약 0.464~2.154배'}
$('planet').oninput=linkPlanet;$('mode').onchange=()=>{const e=$('planet'),v=e.valueAsNumber||1;e.value=$('mode').value==='mass'?v**3:Math.cbrt(v);linkPlanet()};
function settings(){const c={massRatio:massRatio(),air:$('air').checked};for(const k of ['kg','area','thrust','height','speed','burn','duration','dt','detach','decay'])c[k]=Number($(k).value);return c}
function densityAt(c,h){
 if(!c.air||h>=120000)return 0;
 return 1.225*(1-c.decay/100)**(Math.max(0,h)/1000)
}
function simulate(c){
 const R=R0*Math.cbrt(c.massRatio),dt=c.dt,N=Math.round(1/dt);
 let r=R+c.height*1000,v=c.speed*1000,t=0,check=null,impact=false;
 let mass=c.kg;
 const gravity=()=>G*(M*c.massRatio+mass);
 const point=()=>({t,h:r-R,r,v,mass,esc:Math.sqrt(2*gravity()/r)}),rows=[point()];
 for(let sec=0;sec<c.duration&&!impact;sec++){
  const push=sec<c.burn?c.thrust*1e6/mass:0;
  for(let j=1;j<=N;j++){
   t=sec+j/N;const h=r-R,old=v,free=v+dt*(push-gravity()/(r*r));
   const k=.25*densityAt(c,h)*c.area/mass;
   v=2*free/(1+Math.sqrt(1+4*k*dt*Math.abs(free)));const dx=dt*(old+v)/2;
   if(dx<0&&h+dx<=0){const f=-h/dx;t=t-dt+dt*f;v=old+f*(v-old);r=R;impact=true;break}
   r+=dx;if(c.detach>0&&t===c.detach)mass=.8*c.kg;
   if(!check&&t>=c.burn&&(!c.air||r-R>=120000))check=point();
  } rows.push(point());
 }
 const result=impact?'표면 도달':!check?'판정 보류':check.v>=check.esc?'탈출 가능':'중력에 묶임';
 return {c,R,rows,check,result,impact};
}
</script>

}
function update(){const p=run.rows[index],check=run.check;$('timeline').value=index;$('clock').textContent='T + '+format(p.t,1)+' s';$('alt').textContent=format(p.h/1000);$('vel').textContent=format(p.v/1000,3);$('esc').textContent=format(p.esc/1000,3);$('play').textContent=playing?'일시 정지':index===run.rows.length-1?'다시 재생':index?'이어서 재생':'▶ 실험 시작';
 $('decision').textContent=run.impact&&index===run.rows.length-1?'표면 도달':check&&p.t>=check.t?(check.v>=check.esc?'탈출 가능':'중력에 묶임'):index===run.rows.length-1?'판정 보류':p.t===0?'발사 대기':p.t<run.c.burn?'추진 중':'대기권 비행 중';
 $('evidence').textContent='행성 중심 거리 '+format(p.r/1000,1)+' km · 위성 질량 '+format(p.mass,0)+' kg'+(p.mass<run.c.kg?' · 연료통 분리 완료':'');
 draw();chart(graph,['h']);chart($('velocityGraph'),['v','esc'])
}
function showResult(){completed=true;$('reopen').hidden=false;$('summary').textContent=run.result+' · 관측 시간 '+format(run.rows.at(-1).t,2)+'초. 시간별 위치와 속도, 실험 조건을 CSV 파일로 저장할 수 있습니다.';if(!$('finished').open)$('finished').showModal()}
function tick(now){if(!playing)return;carry+=(now-last)/1000*Math.max(1,run.rows.length/18);last=now;let step=Math.floor(carry);if(step){carry-=step;index=Math.min(run.rows.length-1,index+step);if(index===run.rows.length-1)playing=false;update();if(!playing)showResult()}if(playing)frame=requestAnimationFrame(tick)}
let frame=0;function playback(on){cancelAnimationFrame(frame);playing=on;carry=0;last=performance.now();update();if(on)frame=requestAnimationFrame(tick)}
function execute(){run=simulate(settings());index=0;completed=false;$('reopen').hidden=true;$('timeline').max=run.rows.length-1;playback(false)}
$('play').onclick=()=>{if(index===run.rows.length-1)index=0;playback(!playing)};
$('timeline').oninput=e=>{index=+e.target.value;playback(false);if(index===run.rows.length-1&&!completed)showResult()};
let snapshot,resume=false;
const panes=['planet','ship','time'],editor=$('editor');
function openEditor(kind){
 resume=playing;playback(false);
 snapshot=[...$('form').querySelectorAll('input,select')].map(e=>[e,e.value,e.checked]);
 for(const name of panes)$(name+'Pane').hidden=name!==kind;
 $('editTitle').textContent={planet:'행성 조건',ship:'우주선 조건',time:'실험 설정'}[kind];
 editor.showModal()
}
for(const name of panes)$(name+'Open').onclick=()=>openEditor(name);
function cancelEdit(){for(const [e,v,checked] of snapshot){e.value=v;if(e.type==='checkbox')e.checked=checked}linkPlanet();syncAir();editor.close();playback(resume)}
editor.oncancel=e=>{e.preventDefault();cancelEdit()};$('cancelEdit').onclick=cancelEdit;
$('form').onsubmit=e=>{e.preventDefault();editor.close();execute()};
$('dismiss').onclick=()=>$('finished').close();$('reopen').onclick=()=>{playback(false);showResult()};
function home(){if(viewMode==='onboard')onboardZoom=1;else {yaw=pitch=0;zoom=1}draw()}$('home').onclick=home;$('reset').onclick=()=>{$('form').reset();syncAir();linkPlanet();onboardZoom=1;setView('external');home();execute()};
function scale(f){if(viewMode==='onboard')onboardZoom=Math.max(.25,Math.min(3,onboardZoom*f));else zoom=Math.max(.25,Math.min(3,zoom*f));draw()}$('plus').onclick=()=>scale(1.2);$('minus').onclick=()=>scale(1/1.2);
function pick(x,y){
 if(hitShip&&(Math.hypot(x-hitShip.x,y-hitShip.y)<=18||(x>=hitShip.x+15&&x<=hitShip.x+56&&y>=hitShip.y-36&&y<=hitShip.y-12)))return 'ship';
 if(hitPlanet&&Math.hypot(x-hitPlanet.x,y-hitPlanet.y)<=hitPlanet.r)return 'planet';
 return null
}
function targetAt(e){const rect=scene.getBoundingClientRect();return pick(e.clientX-rect.left,e.clientY-rect.top)}
scene.onpointerdown=e=>{if(!e.isPrimary||e.button!==0)return;drag={sx:e.clientX,sy:e.clientY,x:e.clientX,y:e.clientY,moved:false,target:targetAt(e)};scene.setPointerCapture(e.pointerId)};
scene.onpointermove=e=>{if(!e.isPrimary)return;if(!drag){scene.style.cursor=targetAt(e)?'pointer':viewMode==='onboard'?'default':'grab';return}
 if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<6)return;
 drag.moved=true;if(viewMode==='onboard')return;yaw+=(e.clientX-drag.x)*.009;pitch=Math.max(-1.52,Math.min(1.52,pitch-(e.clientY-drag.y)*.009));drag.x=e.clientX;drag.y=e.clientY;draw()};
scene.onpointerup=e=>{if(!e.isPrimary||!drag)return;const kind=!drag.moved&&drag.target;drag=null;if(kind)openEditor(kind)};
scene.onlostpointercapture=()=>drag=null;scene.onwheel=e=>{e.preventDefault();scale(Math.exp(-e.deltaY*.001))};scene.addEventListener('wheel',scene.onwheel,{passive:false});scene.onwheel=null;
$('csv').onclick=()=>{const {rows,check,c}=run,points=new Map(rows.map(p=>[p.t,p]));if(check)points.set(check.t,check);
 const header=['time_s','distance_m','altitude_m','velocity_m_s','escape_m_s','mass_kg','event','result',...Object.keys(c),'radius_m'];
 const lines=[header,...[...points.values()].sort((a,b)=>a.t-b.t).map(p=>[p.t,p.r,p.h,p.v,p.esc,p.mass,[p.mass<c.kg&&p.t===c.detach?'tank_separation':'',p.t===c.burn?'burnout':'',p.t===check?.t?'check':'',run.impact&&p===rows.at(-1)?'impact':''].filter(Boolean).join('+'),run.result,...Object.values(c),run.R])];
 const u=URL.createObjectURL(new Blob(['\uFEFF'+lines.map(x=>x.join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='escape-experiment.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)};
linkPlanet();execute();new ResizeObserver(()=>update()).observe(scene);
</script></html>
